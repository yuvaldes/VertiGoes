<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VertiGoes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html, body { width: 100%; height: 100%; background: #fafafa; }
      body { margin: 0; overflow: hidden; }
      #root { display: flex; flex: 1; height: 100%; min-height: 0; }
      @supports (height: 100dvh) { #root { height: 100dvh; } }
    </style>
  </head>
  <body>
    <noscript>Please enable JavaScript to open VertiGoes.</noscript>
    <div id="root"></div>
  </body>
</html>
